{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f5">
  <title>Create account | Landslide Image Classifier</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'images/landslide.svg' %}">
  <link rel="stylesheet" href="{% static 'layout/styles/minimal.css' %}">
</head>
<body class="minimal-page">
  <header class="minimal-header">
    <a class="minimal-brand" href="{% url 'accuracy' %}">
      <img src="{% static 'images/landslide.svg' %}" alt="">
      <span>Landslide Image Classifier</span>
    </a>
    <nav class="minimal-nav" aria-label="Main navigation">
      <a href="{% url 'accuracy' %}">Home</a>
      <a href="{% url 'login' %}">Log in</a>
    </nav>
  </header>
  <main class="minimal-main auth-layout">
    <section class="auth-card" aria-labelledby="register-title">
      <h1 id="register-title">Create your account</h1>
      <p>Enter your details to get started.</p>
      {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
      <form class="auth-form" action="{% url 'save' %}" method="post">
        {% csrf_token %}
        <div class="auth-fields">
          <label class="auth-field">Username
            <input type="text" name="username" value="{{ form_data.username|default:'' }}" autocomplete="username" required>
          </label>
          <label class="auth-field">Password
            <input type="password" name="password" autocomplete="new-password" required>
          </label>
          <label class="auth-field">Email
            <input type="email" name="email" value="{{ form_data.email|default:'' }}" autocomplete="email" required>
          </label>
          <label class="auth-field">Age
            <input type="number" name="age" min="17" max="120" value="{{ form_data.age|default:'' }}" required>
          </label>
          <label class="auth-field">Gender
            <input type="text" name="gender" value="{{ form_data.gender|default:'' }}" required>
          </label>
          <label class="auth-field">Phone
            <input type="tel" name="phone" value="{{ form_data.phone|default:'' }}" autocomplete="tel" required>
          </label>
        </div>
        <label class="auth-field">Address
          <input type="text" name="address" value="{{ form_data.address|default:'' }}" autocomplete="street-address" required>
        </label>
        <button class="upload-submit" type="submit">Create account</button>
      </form>
      <p class="auth-footnote">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
    </section>
  </main>
</body>
</html>
