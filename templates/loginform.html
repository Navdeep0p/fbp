{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f5">
  <title>Log in | Landslide Image Classifier</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'images/landslide.svg' %}">
  <link rel="stylesheet" href="{% static 'layout/styles/minimal.css' %}">
</head>
<body class="minimal-page">
  <header class="minimal-header">
    <a class="minimal-brand" href="{% url 'accuracy' %}">
      <img src="{% static 'images/landslide.svg' %}" alt="">
      <span>Landslide Image Classifier</span>
    </a>
    <nav class="minimal-nav" aria-label="Main navigation">
      <a href="{% url 'accuracy' %}">Home</a>
      <a href="{% url 'reg' %}">Create account</a>
    </nav>
  </header>
  <main class="minimal-main auth-layout">
    <section class="auth-card" aria-labelledby="login-title">
      <h1 id="login-title">Welcome back</h1>
      <p>Log in to your account.</p>
      {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
      <form class="auth-form" action="{% url 'loginCheck' %}" method="post">
        {% csrf_token %}
        <label class="auth-field">Username
          <input type="text" name="username" autocomplete="username" required>
        </label>
        <label class="auth-field">Password
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="upload-submit" type="submit">Log in</button>
      </form>
      <p class="auth-footnote">New here? <a href="{% url 'reg' %}">Create an account</a></p>
    </section>
  </main>
</body>
</html>
